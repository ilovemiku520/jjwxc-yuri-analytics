name: offline-phase0-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYURI_ENABLE_NETWORK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[api,dev,postgres]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src tests
      - name: Tests
        run: pytest --cov=pixiv_yuri --cov-report=term-missing
      - name: Offline smoke probe
        run: |
          pyuri-schema-probe analyze \
            --manifest fixtures/manifest.json \
            --output var/reports
          pyuri-schema-probe validate \
            --manifest fixtures/manifest.json \
            --policy fixtures/schema_policy.json \
            --output var/reports

  web-and-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate Railway infrastructure definition
        run: node --experimental-strip-types -e "import('./.railway/railway.ts').then(({ default: config }) => { if (typeof config !== 'function') process.exit(1) })"
      - name: Web lint and type check
        run: |
          pnpm --filter @pyuri/web lint
          pnpm --filter @pyuri/web typecheck
      - name: Web tests and production build
        run: |
          pnpm --filter @pyuri/web test
          pnpm --filter @pyuri/web build
