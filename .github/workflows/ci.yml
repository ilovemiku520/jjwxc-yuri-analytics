name: offline-phase0-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYURI_ENABLE_NETWORK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[api,dev,postgres]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src tests
      - name: Tests
        run: pytest --cov=pixiv_yuri --cov-report=term-missing
      - name: Offline smoke probe
        run: |
          pyuri-schema-probe analyze \
            --manifest fixtures/manifest.json \
            --output var/reports
          pyuri-schema-probe validate \
            --manifest fixtures/manifest.json \
            --policy fixtures/schema_policy.json \
            --output var/reports
